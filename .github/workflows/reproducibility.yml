name: reproducibility

on:
  push:
    branches: [main, "reproducibility/**"]
  pull_request:

permissions:
  contents: read

jobs:
  integrity-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Verify public package integrity
        run: python -m unittest discover -s tests -v

      - name: Set up R 4.4.2
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Parse R sources
        shell: Rscript {0}
        run: |
          files <- c(
            "run_all.R",
            "install_packages.R",
            list.files("scripts", pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
          )
          for (f in files) {
            parse(file = f)
            cat("Parsed:", f, "\n")
          }
